const dsSel  = document.getElementById("dsSel");
const sexSel = document.getElementById("sexSel");
const subSel = document.getElementById("subSel");
const ageSel = document.getElementById("ageSel");
const frame  = document.getElementById("frame");
const noImg  = document.getElementById("noImage");
const metaLn = document.getElementById("metaLine");
const noteLn = document.getElementById("noteLine");

function uniq(arr){ return Array.from(new Set(arr)); }

function populateDatasets(preserve){
  const dss = uniq(files.map(d => JSON.stringify({k:d.dataset, l:d.dataset_label}))).map(s=>JSON.parse(s));
  const prev = preserve ?? dsSel.value;
  dsSel.innerHTML = "";
  dss.forEach(d => { const o=document.createElement("option"); o.value=d.k; o.textContent=d.l; dsSel.appendChild(o); });
  if (dss.some(d=>d.k===prev)) dsSel.value = prev;
}

function populateSexes(preserve){
  const ds = dsSel.value;
  const sexes = uniq(files.filter(d => d.dataset===ds).map(d => d.sex))
    .sort((a,b)=>(a==="All"?-1:b==="All"?1:a.localeCompare(b)));
  const prev = preserve ?? sexSel.value;
  sexSel.innerHTML = "";
  sexes.forEach(s => { const o=document.createElement("option"); o.value=s; o.textContent=s; sexSel.appendChild(o); });
  if (sexes.includes(prev)) sexSel.value = prev;
}

function populateSubtypes(preserve){
  const ds=dsSel.value, sx=sexSel.value;
  const subs = uniq(files.filter(d => d.dataset===ds && d.sex===sx)
    .map(d => JSON.stringify({k:d.sub_key, l:d.sub_label}))).map(s=>JSON.parse(s))
    .sort((a,b)=>(a.k==="all"?-1:b.k==="all"?1:a.l.localeCompare(b.l)));
  const prev = preserve ?? subSel.value;
  subSel.innerHTML = "";
  subs.forEach(s => { const o=document.createElement("option"); o.value=s.k; o.textContent=s.l; subSel.appendChild(o); });
  if (subs.some(s=>s.k===prev)) subSel.value = prev;
}

function populateAges(preserve){
  const ds=dsSel.value, sx=sexSel.value, sk=subSel.value;
  const rows = files.filter(d => d.dataset===ds && d.sex===sx && d.sub_key===sk)
    .map(d => ({k:d.age_key, l:d.age_label}));
  const seen = new Set(); const ages = [];
  for (const r of rows){ if(!seen.has(r.k)){ seen.add(r.k); ages.push(r); } }

  const ageOrder = {"all": 0, "10-14": 1, "15-17": 2, "18-25": 3};
  ages.sort((a,b)=> (ageOrder[a.k] ?? 999) - (ageOrder[b.k] ?? 999));

  const prev = preserve ?? ageSel.value;
  ageSel.innerHTML = "";
  ages.forEach(a => { const o=document.createElement("option"); o.value=a.k; o.textContent=a.l; ageSel.appendChild(o); });
  if (ages.some(a=>a.k===prev)) ageSel.value = prev;
}

function rowFor(){
  const ds=dsSel.value, sx=sexSel.value, sk=subSel.value, ak=ageSel.value;
  return files.find(d => d.dataset===ds && d.sex===sx && d.sub_key===sk && d.age_key===ak) || null;
}

function updateFrame(){
  const row = rowFor();

  if (row) {
    if (row.has_plot && row.file) {
      const disc = row.disclosure_min_n ? "; disclosure threshold n ≥ " + row.disclosure_min_n : "";
      metaLn.textContent = "n = " + row.n + disc;
      metaLn.style.display = "block";

      noteLn.textContent = "";
      noteLn.style.display = "none";

      frame.src = row.file;
      frame.style.display = "block";
      noImg.style.display = "none";
      noImg.textContent = "";
    } else {
      metaLn.style.display = "none";
      noteLn.textContent = row.msg || "No graph available.";
      noteLn.style.display = "block";

      frame.removeAttribute("src");
      frame.style.display = "none";
      noImg.style.display = "block";
      noImg.textContent = "No plot available for this selection.";
    }
  } else {
    frame.removeAttribute("src");
    frame.style.display = "none";
    noImg.style.display = "block";
    noImg.textContent = "Select options above to view transitions";
    metaLn.style.display = "none";
    noteLn.textContent = "";
    noteLn.style.display = "none";
  }
}

function repopulateAll(){
  const prev = {ds: dsSel.value, sx: sexSel.value, sk: subSel.value, ak: ageSel.value};
  populateDatasets(prev.ds);
  populateSexes(prev.sx);
  populateSubtypes(prev.sk);
  populateAges(prev.ak);
  updateFrame();
}

dsSel.addEventListener("change", repopulateAll);
sexSel.addEventListener("change", repopulateAll);
subSel.addEventListener("change", () => { populateAges(ageSel.value); updateFrame(); });
ageSel.addEventListener("change", updateFrame);

// init
populateDatasets();
populateSexes();
populateSubtypes();
populateAges();
updateFrame();
</script>
</body>
</html>
