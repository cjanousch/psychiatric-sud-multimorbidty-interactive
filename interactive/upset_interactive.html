const dsSel  = document.getElementById("dsSel");
const winSel = document.getElementById("winSel");
const sexSel = document.getElementById("sexSel");
const ageSel = document.getElementById("ageSel");
const iframe = document.getElementById("upsetFrame");

function uniq(arr){ return Array.from(new Set(arr)); }

function populateDatasets(preserve){
  const dss = uniq(files.map(d => JSON.stringify({k:d.dataset, l:d.dataset_label}))).map(s=>JSON.parse(s));
  const prev = preserve ?? dsSel.value;
  dsSel.innerHTML = "";
  dss.forEach(d => { const o=document.createElement("option"); o.value=d.k; o.textContent=d.l; dsSel.appendChild(o); });
  if (dss.some(d=>d.k===prev)) dsSel.value = prev;
}

function populateWindows(preserve){
  const ds = dsSel.value;
  const wins = uniq(files.filter(d=>d.dataset===ds).map(d=>JSON.stringify({k:d.window, l:d.window_label}))).map(s=>JSON.parse(s));
  const order = ["all","pre","index","post1","post2"];
  wins.sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k));

  const prev = preserve ?? winSel.value;
  winSel.innerHTML="";
  wins.forEach(w => { const o=document.createElement("option"); o.value=w.k; o.textContent=w.l; winSel.appendChild(o); });
  if (wins.some(w=>w.k===prev)) winSel.value = prev;
}

function populateSexes(preserve){
  const ds = dsSel.value, w = winSel.value;
  const sexes = uniq(files.filter(d=>d.dataset===ds && d.window===w).map(d=>d.sex))
    .sort((a,b)=>(a==="All"?-1:b==="All"?1:a.localeCompare(b)));
  const prev = preserve ?? sexSel.value;
  sexSel.innerHTML="";
  sexes.forEach(s => { const o=document.createElement("option"); o.value=s; o.textContent=s; sexSel.appendChild(o); });
  if (sexes.includes(prev)) sexSel.value = prev;
}

function populateAges(preserve){
  const ds=dsSel.value, w=winSel.value, sx=sexSel.value;
  const ages = uniq(files.filter(d=>d.dataset===ds && d.window===w && d.sex===sx).map(d=>JSON.stringify({k:d.age_key, l:d.age_label}))).map(s=>JSON.parse(s));

  const ageOrder = {"all": 0, "10-14": 1, "15-17": 2, "18-25": 3};
  ages.sort((a,b)=> (ageOrder[a.k] ?? 999) - (ageOrder[b.k] ?? 999));

  const prev = preserve ?? ageSel.value;
  ageSel.innerHTML="";
  ages.forEach(a => { const o=document.createElement("option"); o.value=a.k; o.textContent=a.l; ageSel.appendChild(o); });
  if (ages.some(a=>a.k===prev)) ageSel.value = prev;
}

function srcFor(){
  const ds=dsSel.value, w=winSel.value, sx=sexSel.value, a=ageSel.value;
  const row = files.find(d=>d.dataset===ds && d.window===w && d.sex===sx && d.age_key===a);
  return row ? row.file : "";
}

function updateFrame(){
  iframe.src = srcFor() || "";
}

function repopulateAll(){
  const prev = {ds: dsSel.value, w: winSel.value, sx: sexSel.value, a: ageSel.value};
  populateDatasets(prev.ds);
  populateWindows(prev.w);
  populateSexes(prev.sx);
  populateAges(prev.a);
  updateFrame();
}

dsSel.addEventListener("change", repopulateAll);
winSel.addEventListener("change", repopulateAll);
sexSel.addEventListener("change", () => { populateAges(ageSel.value); updateFrame(); });
ageSel.addEventListener("change", updateFrame);

// init
populateDatasets();
populateWindows();
populateSexes();
populateAges();
updateFrame();
</script>
